name: Discord Release & Roadmap Sync

on:
  release:
    types: [published]
  push:
    branches:
      - main

jobs:
  discord-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if Push is a Release Commit
        id: release_check
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "${{ github.event_name }}" == "release" ]] || [[ "$COMMIT_MSG" =~ ^[R|r]elease:? ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Post Release Announcement to #changelog
        if: steps.release_check.outputs.is_release == 'true'
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: "1531779398234013890"
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RELEASE_TITLE: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          if [ -z "$DISCORD_TOKEN" ]; then
            echo "DISCORD_TOKEN secret is missing. Skipping."
            exit 0
          fi

          TITLE="${RELEASE_TITLE:-$COMMIT_MSG}"
          BODY="${RELEASE_BODY:-$COMMIT_MSG}"

          ANNOUNCEMENT="🚀 **X4 FORGE - RELEASE UPDATE**\n\nThanks to all testers and the community for your feedback and support!\n\n**Support the Project**:\n• **Patreon**: <https://patreon.com/>\n\n**Downloads & Release**:\n• **Open VSX Marketplace**: <https://open-vsx.org/extension/x4forge/x4-forge-studio>\n• **GitHub Release**: <https://github.com/KennyG1990/X4_Forge/releases>\n\n**Upgrade Instructions**:\nReload your editor window after installing to ensure the latest language server loads cleanly.\n\n\`\`\`markdown\n${BODY:0:1200}\n\`\`\`"

          PAYLOAD=$(jq -n \
            --arg content "$ANNOUNCEMENT" \
            '{ content: $content }')

          curl -s -H "Authorization: Bot $DISCORD_TOKEN" \
               -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "https://discord.com/api/v10/channels/$CHANNEL_ID/messages"

      - name: Check if ROADMAP.md Changed
        id: check_roadmap
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^ROADMAP.md$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync ROADMAP.md to #roadmap
        if: steps.check_roadmap.outputs.changed == 'true'
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: "1531779414579478539"
        run: |
          if [ -z "$DISCORD_TOKEN" ]; then
            echo "DISCORD_TOKEN secret is missing. Skipping Roadmap sync."
            exit 0
          fi
          ROADMAP_CONTENT=$(head -n 40 ROADMAP.md)
          PAYLOAD=$(jq -n \
            --arg title "🗺️ ROADMAP.md Updated" \
            --arg desc "$ROADMAP_CONTENT" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 15844367,
                footer: { text: "Synced from repo ROADMAP.md" },
                timestamp: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
              }]
            }')
          curl -s -H "Authorization: Bot $DISCORD_TOKEN" \
               -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "https://discord.com/api/v10/channels/$CHANNEL_ID/messages"
