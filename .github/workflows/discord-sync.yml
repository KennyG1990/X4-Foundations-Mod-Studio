name: Discord Release Sync

on:
  release:
    types: [published]
  push:
    branches:
      - main

jobs:
  discord-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Post Update Announcement with Attached Changelog Text File
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: "1531779398234013890"
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          SHORT_SHA: ${{ github.sha }}
          RELEASE_TITLE: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          if [ -z "$DISCORD_TOKEN" ]; then
            echo "DISCORD_TOKEN secret is missing. Skipping."
            exit 0
          fi

          # Format version or commit title
          VERSION=$(echo "${RELEASE_TITLE:-$COMMIT_MSG}" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' || echo "Commit ${SHORT_SHA:0:7}")
          
          # Generate changelog text file
          CHANGELOG_FILE="changelog-${SHORT_SHA:0:7}.txt"
          echo "### X4 Forge Commit & Release Changelog (${VERSION})" > "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"
          
          if [ -n "$RELEASE_BODY" ]; then
            echo "$RELEASE_BODY" >> "$CHANGELOG_FILE"
          else
            git log -n 10 --pretty=format:"* %s (%h)" >> "$CHANGELOG_FILE"
          fi

          # Create multi-line message content cleanly using a heredoc
          cat << EOF > msg_content.txt
**X4 FORGE - UPDATE (${VERSION})**

Thanks to all testers and the community for feedback and support!

**Support me**:
https://patreon.com/

**Download & Repository**:
**Open VSX Marketplace**: https://open-vsx.org/extension/x4forge/x4-forge-studio
**GitHub Repository**: https://github.com/KennyG1990/X4_Forge

**To apply this update correctly**, reload your editor window after updating to ensure the latest extension engine loads cleanly.
EOF

          PAYLOAD=$(jq -n --rawfile content msg_content.txt '{content: $content}')

          curl -s -H "Authorization: Bot $DISCORD_TOKEN" \
               -F "payload_json=$PAYLOAD" \
               -F "files[0]=@$CHANGELOG_FILE" \
               "https://discord.com/api/v10/channels/$CHANNEL_ID/messages"

      - name: Check if ROADMAP.md Changed
        id: check_roadmap
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^ROADMAP.md$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync ROADMAP.md to #roadmap
        if: steps.check_roadmap.outputs.changed == 'true'
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: "1531779414579478539"
        run: |
          if [ -z "$DISCORD_TOKEN" ]; then
            echo "DISCORD_TOKEN secret is missing. Skipping."
            exit 0
          fi

          ROADMAP_CONTENT=$(head -n 25 ROADMAP.md)
          
          PAYLOAD=$(jq -n \
            --arg title "🗺️ X4 Forge — Prototype Validation Roadmap" \
            --arg desc "$ROADMAP_CONTENT" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 3447003,
                footer: { text: "X4 Forge Roadmap • Automated from GitHub" },
                timestamp: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
              }]
            }')

          curl -s -H "Authorization: Bot $DISCORD_TOKEN" \
               -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "https://discord.com/api/v10/channels/$CHANNEL_ID/messages"
