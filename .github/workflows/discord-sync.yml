name: Discord Changelog & Roadmap Sync

on:
  push:
    branches:
      - main

jobs:
  discord-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Sync Git Push to #changelog
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: "1531779398234013890"
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$DISCORD_TOKEN" ]; then
            echo "DISCORD_TOKEN secret is missing. Skipping Discord notification."
            exit 0
          fi
          SHORT_SHA="${SHA:0:7}"
          PAYLOAD=$(jq -n \
            --arg title "🔨 New Commit to X4 Forge ($SHORT_SHA)" \
            --arg url "$COMMIT_URL" \
            --arg desc "$COMMIT_MSG" \
            --arg author "$AUTHOR" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 3447003,
                author: { name: $author },
                timestamp: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
              }]
            }')
          curl -s -H "Authorization: Bot $DISCORD_TOKEN" \
               -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "https://discord.com/api/v10/channels/$CHANNEL_ID/messages"

      - name: Check if ROADMAP.md Changed
        id: check_roadmap
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^ROADMAP.md$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync ROADMAP.md to #roadmap
        if: steps.check_roadmap.outputs.changed == 'true'
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: "1531779414579478539"
        run: |
          if [ -z "$DISCORD_TOKEN" ]; then
            echo "DISCORD_TOKEN secret is missing. Skipping Roadmap sync."
            exit 0
          fi
          ROADMAP_CONTENT=$(head -n 40 ROADMAP.md)
          PAYLOAD=$(jq -n \
            --arg title "🗺️ ROADMAP.md Updated" \
            --arg desc "$ROADMAP_CONTENT" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 15844367,
                footer: { text: "Synced from repo ROADMAP.md" },
                timestamp: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
              }]
            }')
          curl -s -H "Authorization: Bot $DISCORD_TOKEN" \
               -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "https://discord.com/api/v10/channels/$CHANNEL_ID/messages"
