name: Sync GitHub Issue State to Discord Forums

on:
  issues:
    types: [opened, closed, reopened]

permissions:
  issues: write
  contents: read

jobs:
  sync-to-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Synchronize canonical GitHub issue state with its Discord thread
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          USER: ${{ github.event.issue.user.login }}
          LABELS: ${{ toJson(github.event.issue.labels.*.name) }}
          CONFIG_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          CONFIG_BUG_FORUM_ID: ${{ vars.DISCORD_BUG_FORUM_ID }}
          CONFIG_FEATURE_FORUM_ID: ${{ vars.DISCORD_FEATURE_FORUM_ID }}
        run: |
          set -euo pipefail

          GUILD_ID="${CONFIG_GUILD_ID:-1528637983429759217}"
          BUG_FORUM_ID="${CONFIG_BUG_FORUM_ID:-1531779148333453452}"
          FEATURE_FORUM_ID="${CONFIG_FEATURE_FORUM_ID:-1531779159217405962}"

          if [ -z "${DISCORD_TOKEN:-}" ]; then
            echo "DISCORD_TOKEN secret is missing. Skipping sync."
            exit 0
          fi

          extract_sync_line() {
            printf '%s\n' "$1" | grep -oE 'discord-sync:v1[^>]*' | head -n 1 || true
          }

          sync_field() {
            local key="$1"
            printf '%s\n' "$SYNC_LINE" | tr ' ' '\n' | sed -n "s/^${key}=//p" | head -n 1
          }

          post_thread_message() {
            local thread_id="$1"
            local message="$2"
            local payload
            payload=$(jq -n --arg content "$message" '{content: $content}')
            curl --fail --silent --show-error --retry 3 \
              -H "Authorization: Bot $DISCORD_TOKEN" \
              -H "Content-Type: application/json" \
              -X POST -d "$payload" \
              "https://discord.com/api/v10/channels/$thread_id/messages" >/dev/null
          }

          patch_thread_state() {
            local thread_id="$1"
            local archived="$2"
            local locked="$3"
            local payload
            payload=$(jq -n --argjson archived "$archived" --argjson locked "$locked" \
              '{archived: $archived, locked: $locked}')
            curl --fail --silent --show-error --retry 3 \
              -H "Authorization: Bot $DISCORD_TOKEN" \
              -H "Content-Type: application/json" \
              -X PATCH -d "$payload" \
              "https://discord.com/api/v10/channels/$thread_id" >/dev/null
          }

          record_mapping() {
            local origin="$1"
            local guild_id="$2"
            local forum_id="$3"
            local thread_id="$4"
            local mapping
            mapping=$(cat <<EOF
          <!-- discord-sync:v1 origin=$origin repo=$REPOSITORY guild=$guild_id forum=$forum_id thread=$thread_id issue=$ISSUE_NUM -->

          Discord thread: https://discord.com/channels/$guild_id/$thread_id
          EOF
            )
            gh api -X POST "repos/$REPOSITORY/issues/$ISSUE_NUM/comments" -f body="$mapping" >/dev/null
          }

          recover_unmapped_thread() {
            local repo_name="${REPOSITORY#*/}"
            local active candidate
            active=$(curl --fail --silent --show-error --retry 3 \
              -H "Authorization: Bot $DISCORD_TOKEN" \
              "https://discord.com/api/v10/guilds/$GUILD_ID/threads/active")
            candidate=$(echo "$active" | jq -r \
              --arg current "[$repo_name #$ISSUE_NUM]" \
              --arg legacy "[Issue #$ISSUE_NUM]" \
              '.threads[]? | select((((.name // "") | contains($current))) or (((.name // "") | contains($legacy)))) | [.id, .parent_id] | @tsv' \
              | head -n 1)

            if [ -z "$candidate" ]; then
              return 1
            fi

            THREAD_ID=$(printf '%s' "$candidate" | cut -f1)
            RECOVERED_FORUM_ID=$(printf '%s' "$candidate" | cut -f2)
            record_mapping "github" "$GUILD_ID" "$RECOVERED_FORUM_ID" "$THREAD_ID"
            echo "Recovered existing Discord thread $THREAD_ID and recorded its missing mapping."
            return 0
          }

          create_discord_thread() {
            if [ -z "$GUILD_ID" ] || [ -z "$BUG_FORUM_ID" ] || [ -z "$FEATURE_FORUM_ID" ]; then
              echo "Discord repository variables are incomplete; cannot create a mirror thread."
              exit 1
            fi

            # If Discord succeeded during an earlier attempt but GitHub failed before recording the
            # mapping, adopt that exact issue-number thread rather than creating a duplicate.
            if recover_unmapped_thread; then
              return
            fi

            TARGET_FORUM_ID="$BUG_FORUM_ID"
            ICON="🐛"
            if echo "$LABELS" | grep -iqE 'enhancement|feature'; then
              TARGET_FORUM_ID="$FEATURE_FORUM_ID"
              ICON="💡"
            fi

            REPO_NAME="${REPOSITORY#*/}"
            TITLE="${ICON} [${REPO_NAME} #${ISSUE_NUM}] ${ISSUE_TITLE}"
            TITLE="${TITLE:0:90}"
            BODY_TEXT="**GitHub Issue #${ISSUE_NUM} opened by @${USER}**\n\nLink: ${ISSUE_URL}\n\n>>> ${ISSUE_BODY:0:1400}\n\nsync-origin:github repo=${REPOSITORY} issue=${ISSUE_NUM}"

            PAYLOAD=$(jq -n --arg name "$TITLE" --arg content "$BODY_TEXT" \
              '{name: $name, message: {content: $content}}')

            RESPONSE_FILE=$(mktemp)
            HTTP_STATUS=$(curl --silent --show-error --retry 3 \
              -o "$RESPONSE_FILE" -w '%{http_code}' \
              -H "Authorization: Bot $DISCORD_TOKEN" \
              -H 'Content-Type: application/json' \
              -X POST -d "$PAYLOAD" \
              "https://discord.com/api/v10/channels/$TARGET_FORUM_ID/threads")

            if [[ "$HTTP_STATUS" != 2* ]]; then
              echo "Discord thread creation failed with HTTP $HTTP_STATUS"
              cat "$RESPONSE_FILE"
              exit 1
            fi

            THREAD_ID=$(jq -r '.id // empty' "$RESPONSE_FILE")
            if [ -z "$THREAD_ID" ]; then
              echo "Discord created a thread but returned no thread ID."
              cat "$RESPONSE_FILE"
              exit 1
            fi

            record_mapping "github" "$GUILD_ID" "$TARGET_FORUM_ID" "$THREAD_ID"
            echo "Mapped GitHub issue #$ISSUE_NUM <-> Discord thread $THREAD_ID"
          }

          SYNC_LINE=$(extract_sync_line "${ISSUE_BODY:-}")
          if [ -z "$SYNC_LINE" ]; then
            COMMENTS=$(gh api --paginate "repos/$REPOSITORY/issues/$ISSUE_NUM/comments" --jq '.[].body' || true)
            SYNC_LINE=$(extract_sync_line "$COMMENTS")
          fi

          THREAD_ID=""
          ORIGIN=""
          if [ -n "$SYNC_LINE" ]; then
            THREAD_ID=$(sync_field thread)
            ORIGIN=$(sync_field origin)
            MAPPED_GUILD_ID=$(sync_field guild)
            GUILD_ID="${MAPPED_GUILD_ID:-$GUILD_ID}"
          fi

          case "$ACTION" in
            opened)
              if [ -n "$THREAD_ID" ]; then
                echo "Issue #$ISSUE_NUM already maps to Discord thread $THREAD_ID (origin=$ORIGIN)"
              else
                create_discord_thread
              fi
              ;;

            reopened)
              if [ -z "$THREAD_ID" ]; then
                create_discord_thread
              else
                patch_thread_state "$THREAD_ID" false false
                post_thread_message "$THREAD_ID" "♻️ GitHub issue #$ISSUE_NUM was reopened: $ISSUE_URL"
                echo "Reopened Discord thread $THREAD_ID for issue #$ISSUE_NUM"
              fi
              ;;

            closed)
              if [ -z "$THREAD_ID" ]; then
                echo "Issue #$ISSUE_NUM has no recorded Discord mapping; nothing to close."
                exit 0
              fi
              post_thread_message "$THREAD_ID" "✅ GitHub issue #$ISSUE_NUM was closed: $ISSUE_URL"
              patch_thread_state "$THREAD_ID" true true
              echo "Archived Discord thread $THREAD_ID for closed issue #$ISSUE_NUM"
              ;;

            *)
              echo "Unsupported issue action: $ACTION"
              ;;
          esac
