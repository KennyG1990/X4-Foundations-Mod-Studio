name: Sync GitHub Issues to Discord Forums

on:
  issues:
    types: [opened, closed, reopened]

jobs:
  sync-to-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Sync GitHub Issue to Discord Forum (Bugs & Feature Requests)
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          BUG_FORUM_ID: "1531779148333453452"
          FEATURE_FORUM_ID: "1531779159217405962"
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          USER: ${{ github.event.issue.user.login }}
          LABELS: ${{ toJson(github.event.issue.labels.*.name) }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_TOKEN:-}" ]; then
            echo "DISCORD_TOKEN secret is missing. Skipping sync."
            exit 0
          fi

          # Discord-originated issues must never be echoed back into Discord.
          # This is the authoritative break in the previous feedback loop.
          if [[ "$ISSUE_TITLE" == "[Discord]"* ]] || \
             [[ "$ISSUE_BODY" == *"discord-forum-origin:"* ]] || \
             [[ "$ISSUE_BODY" == *"Reported via Discord Forum."* ]]; then
            echo "Skipping Discord-originated GitHub issue #$ISSUE_NUM"
            exit 0
          fi

          # Target #feature-requests if labeled feature/enhancement, otherwise #bug-reports.
          TARGET_FORUM_ID="$BUG_FORUM_ID"
          ICON="🐛"
          if echo "$LABELS" | grep -iqE "enhancement|feature"; then
            TARGET_FORUM_ID="$FEATURE_FORUM_ID"
            ICON="💡"
          fi

          # Keep a stable, machine-detectable issue reference in the thread title.
          TITLE="${ICON} [Issue #${ISSUE_NUM}] ${ISSUE_TITLE}"
          TITLE="${TITLE:0:90}"
          BODY_TEXT="**GitHub Issue #${ISSUE_NUM} Opened by @${USER}**\n\nLink: ${ISSUE_URL}\n\n>>> ${ISSUE_BODY:0:1500}"

          PAYLOAD=$(jq -n \
            --arg name "$TITLE" \
            --arg content "$BODY_TEXT" \
            '{
              name: $name,
              message: { content: $content }
            }')

          RESPONSE_FILE=$(mktemp)
          HTTP_STATUS=$(curl --silent --show-error --retry 3 \
               -o "$RESPONSE_FILE" \
               -w "%{http_code}" \
               -H "Authorization: Bot $DISCORD_TOKEN" \
               -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "https://discord.com/api/v10/channels/$TARGET_FORUM_ID/threads")

          if [[ "$HTTP_STATUS" != 2* ]]; then
            echo "Discord thread creation failed with HTTP $HTTP_STATUS"
            cat "$RESPONSE_FILE"
            exit 1
          fi

          echo "Created Discord mirror thread for GitHub issue #$ISSUE_NUM"
