name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install extension type dependencies
        run: npm ci --prefix vscode-extension

      - name: Reject high-severity dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Reject high-severity extension dependency vulnerabilities
        run: npm audit --prefix vscode-extension --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 600

      - name: Run deterministic oracle integration
        run: npm run test:oracles

      - name: Prove fail-closed E2E flake policy
        run: npm run test:e2e-policy

      - name: Build production bundle
        run: npm run build

      - name: Run isolated route integration
        run: npm run test:routes

      - name: Build extension controller and supervisor
        run: npm run build --prefix vscode-extension

      - name: Stage packaged application
        run: npm run stage-app --prefix vscode-extension

      - name: Probe staged packaged sidecar
        run: npm run probe-app --prefix vscode-extension

      - name: Prove VSIX inspector rejection policy
        run: npm run inspect-package --prefix vscode-extension -- --selftest

      - name: Package VSIX without publishing
        run: npm run package --prefix vscode-extension -- --out x4-forge-studio-ci.vsix

      - name: Inspect final VSIX bytes
        run: npm run inspect-package --prefix vscode-extension -- x4-forge-studio-ci.vsix

      - name: Retain inspected VSIX as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: x4-forge-studio-${{ github.sha }}
          path: vscode-extension/x4-forge-studio-ci.vsix
          if-no-files-found: error
          retention-days: 14
